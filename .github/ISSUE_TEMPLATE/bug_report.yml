name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [Clipboard, Sticky Notes, Ad Shield, Share Anywhere, Floating Window, QR Codes, App Lock, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16 Pro, iOS 27.2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
