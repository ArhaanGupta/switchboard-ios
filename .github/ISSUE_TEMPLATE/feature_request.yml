name: Feature or module idea
description: Suggest an improvement or a new module
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android equivalent (if any)
      placeholder: e.g. Android's built-in screen recorder with internal audio
  - type: textarea
    id: ios
    attributes:
      label: Is it possible on iOS?
      description: Any APIs you know of. It's fine to say "not sure".
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: iOS doesn't already do this natively in the latest version
          required: true
