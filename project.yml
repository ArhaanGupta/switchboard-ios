# XcodeGen spec — run `xcodegen generate` to create Switchboard.xcodeproj.
# To make the app yours, change BASE_BUNDLE_ID / APP_GROUP_ID / DEVELOPMENT_TEAM below.
name: Switchboard

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    BASE_BUNDLE_ID: com.example.switchboard
    APP_GROUP_ID: group.com.example.switchboard
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SwitchboardKit:
    path: Packages/SwitchboardKit

targets:
  Switchboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        SBAppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]          # required for Picture-in-Picture (Floating Window)
        UIFileSharingEnabled: true          # received files show up in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Switchboard finds nearby computers and phones running LocalSend so you can send and receive files.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: $(BASE_BUNDLE_ID)
            CFBundleURLSchemes: [switchboard]
    entitlements:
      path: App/Switchboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - package: SwitchboardKit
        product: SwitchboardCore
      - package: SwitchboardKit
        product: ClipboardCore
      - package: SwitchboardKit
        product: ShieldCore
      - package: SwitchboardKit
        product: LocalSendCore
      - target: SwitchboardKeyboard
      - target: SwitchboardWidgets
      - target: SwitchboardShield
      - target: SwitchboardShare

  SwitchboardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).Keyboard
    info:
      path: Extensions/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        SBAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Extensions/Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: SwitchboardKit
        product: SwitchboardCore
      - package: SwitchboardKit
        product: ClipboardCore

  SwitchboardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).Widgets
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        SBAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: SwitchboardKit
        product: SwitchboardCore

  SwitchboardShield:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Shield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).Shield
    info:
      path: Extensions/Shield/Info.plist
      properties:
        CFBundleDisplayName: Switchboard Shield
        SBAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Extensions/Shield/Shield.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - package: SwitchboardKit
        product: SwitchboardCore
      - package: SwitchboardKit
        product: ShieldCore

  SwitchboardShare:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).Share
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        SBAppGroupID: $(APP_GROUP_ID)
        NSLocalNetworkUsageDescription: Switchboard looks for nearby devices running LocalSend to send your files.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Extensions/ShareExtension/Share.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: SwitchboardKit
        product: SwitchboardCore
      - package: SwitchboardKit
        product: LocalSendCore

  SwitchboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Switchboard
    dependencies:
      - target: Switchboard

schemes:
  Switchboard:
    build:
      targets:
        Switchboard: all
        SwitchboardUITests: [test]
    test:
      targets:
        - SwitchboardUITests
    run:
      config: Debug
    archive:
      config: Release
